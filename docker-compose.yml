# ==============================================================================
# Practical 11: Multi-Container Orchestration with Docker Compose
# CHAROTAR UNIVERSITY OF SCIENCE AND TECHNOLOGY
# ADVANCED WEB DEVELOPMENT FRAMEWORKS (ITUE301)
# Services: frontend (React:5173) ──► backend (Express:5000) ──► mongodb (Mongo:27017)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. MongoDB Database Service
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: task-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      # Named volume ensures MongoDB data persists across container restarts
      - mongo-data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. Node.js / Express REST API Backend Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-backend
    restart: unless-stopped
    ports:
      # Host port 5001 mapped to container port 5000 (avoids macOS AirPlay collision on port 5000)
      - "127.0.0.1:5001:5000"
    environment:
      - PORT=5000
      # Uses Docker service name 'mongodb' instead of localhost for container networking
      - MONGO_URI=mongodb://mongodb:27017/taskdb
      - NODE_ENV=production
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network

  # ----------------------------------------------------------------------------
  # 3. React Frontend Service (Built & Served with Vite preview)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://127.0.0.1:5001
    container_name: task-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - app-network

# ==============================================================================
# Named Volumes (Data Persistence)
# ==============================================================================
volumes:
  mongo-data:
    name: task-mongo-data

# ==============================================================================
# Custom Bridge Network (Inter-Container Communication)
# ==============================================================================
networks:
  app-network:
    name: task-app-network
    driver: bridge
